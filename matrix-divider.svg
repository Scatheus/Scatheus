<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80" preserveAspectRatio="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#00ff41" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#00ff41" stop-opacity="0.9"/>
      <stop offset="0.85" stop-color="#00ff41" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="rain" width="36" height="80" patternUnits="userSpaceOnUse">
      <rect width="36" height="80" fill="transparent"/>
      <text x="4" y="18" font-family="Consolas, 'Fira Code', monospace" font-size="14" fill="#00ff41" opacity="0.25">01</text>
      <text x="18" y="38" font-family="Consolas, 'Fira Code', monospace" font-size="14" fill="#00ff41" opacity="0.2">10</text>
      <text x="8" y="58" font-family="Consolas, 'Fira Code', monospace" font-size="14" fill="#00ff41" opacity="0.18">A</text>
      <text x="22" y="74" font-family="Consolas, 'Fira Code', monospace" font-size="14" fill="#00ff41" opacity="0.22">F</text>
    </pattern>

    <mask id="scanMask">
      <rect width="1200" height="80" fill="black"/>
      <rect id="scan" y="0" width="220" height="80" fill="white" opacity="0.95">
        <animate attributeName="x" from="-220" to="1200" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>

  <rect width="1200" height="80" fill="#000000"/>

  <g mask="url(#scanMask)">
    <rect width="1200" height="80" fill="url(#rain)"/>
  </g>

  <line x1="0" y1="40" x2="1200" y2="40" stroke="url(#g)" stroke-width="2" filter="url(#glow)"/>
</svg>
