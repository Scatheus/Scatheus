<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');
            
            .text {
                font-family: 'Fira Code', Consolas, monospace;
                font-weight: 500;
                font-size: 22px;
                fill: #e6edf3;
            }
            .keyword { fill: #ff7b72; }
            .function { fill: #d2a8ff; }
            .string { fill: #a5d6ff; }
            .operator { fill: #79c0ff; }
            .cyan-glow { fill: #00f0ff; text-shadow: 0 0 8px rgba(0,240,255,0.6); }
            .magenta-glow { fill: #ff00ff; text-shadow: 0 0 8px rgba(255,0,255,0.6); }
            
            .window {
                fill: #0d1117;
                stroke: #30363d;
                stroke-width: 1.5;
                rx: 12;
            }
            .header-bar {
                fill: #161b22;
                rx: 12;
            }
            .dot-red { fill: #ff5f56; }
            .dot-yellow { fill: #ffbd2e; }
            .dot-green { fill: #27c93f; }

            /* Typing Animations */
            .line-1 { animation: type1 2s steps(40, end) forwards; overflow: hidden; white-space: nowrap; width: 0; }
            .line-2 { animation: type2 2s steps(40, end) forwards 2s; overflow: hidden; white-space: nowrap; width: 0; opacity: 0; }
            .line-3 { animation: type3 2s steps(40, end) forwards 4s; overflow: hidden; white-space: nowrap; width: 0; opacity: 0; }
            .line-4 { animation: type4 2s steps(40, end) forwards 6s; overflow: hidden; white-space: nowrap; width: 0; opacity: 0; }
            
            .cursor {
                display: inline-block;
                width: 12px;
                height: 24px;
                background-color: #00f0ff;
                animation: blink 1s step-end infinite;
            }

            @keyframes type1 {
                0% { width: 0; }
                100% { width: 100%; }
            }
            @keyframes type2 {
                0% { opacity: 1; width: 0; }
                100% { opacity: 1; width: 100%; }
            }
            @keyframes type3 {
                0% { opacity: 1; width: 0; }
                100% { opacity: 1; width: 100%; }
            }
            @keyframes type4 {
                0% { opacity: 1; width: 0; }
                100% { opacity: 1; width: 100%; }
            }
            @keyframes blink {
                0%, 100% { opacity: 1; }
                50% { opacity: 0; }
            }

            /* Floating Orbs */
            .orb { opacity: 0.15; filter: blur(25px); }
            .orb1 { animation: float1 8s ease-in-out infinite; }
            .orb2 { animation: float2 10s ease-in-out infinite alternate; }

            @keyframes float1 {
                0%, 100% { transform: translateY(0) translateX(0); }
                50% { transform: translateY(-20px) translateX(20px); }
            }
            @keyframes float2 {
                0% { transform: scale(1) translate(0, 0); }
                100% { transform: scale(1.2) translate(-30px, -20px); }
            }
        </style>
    </defs>

    <!-- Background Orbs -->
    <circle cx="150" cy="120" r="80" fill="#00f0ff" class="orb orb1" />
    <circle cx="650" cy="160" r="100" fill="#ff00ff" class="orb orb2" />

    <!-- Terminal Window -->
    <rect x="20" y="20" width="760" height="210" class="window" />
    
    <!-- Mac Header -->
    <path class="header-bar" d="M 20 32 C 20 25.373 25.373 20 32 20 L 768 20 C 774.627 20 780 25.373 780 32 L 780 50 L 20 50 Z" />
    <circle cx="45" cy="35" r="6" class="dot-red" />
    <circle cx="65" cy="35" r="6" class="dot-yellow" />
    <circle cx="85" cy="35" r="6" class="dot-green" />
    
    <!-- Code Content grouped for clipping base typing animation -->
    <g transform="translate(40, 85)">
        <g class="text">
            <!-- Line 1 -->
            <svg y="0" width="0" height="30" class="line-1">
                <text x="0" y="20">
                    <tspan class="keyword">const</tspan> developer <tspan class="operator">=</tspan> {
                </text>
            </svg>

            <!-- Line 2 -->
            <svg y="35" width="0" height="30" class="line-2">
                <text x="30" y="20">
                    name: <tspan class="string">'Ali Essabbar'</tspan>,
                </text>
            </svg>

            <!-- Line 3 -->
            <svg y="70" width="0" height="30" class="line-3">
                <text x="30" y="20">
                    role: <tspan class="cyan-glow">'Full Stack Web Developer'</tspan>,
                </text>
            </svg>

            <!-- Line 4 -->
            <svg y="105" width="700" height="30" class="line-4">
                <text x="30" y="20">
                    skills: [<tspan class="magenta-glow">'React'</tspan>, <tspan class="magenta-glow">'Supabase'</tspan>, <tspan class="magenta-glow">'Laravel'</tspan>, <tspan class="magenta-glow">'Python'</tspan>] 
                </text>
                
                <!-- The cursor -->
                <rect x="650" y="3" width="12" height="22" class="cursor" />
            </svg>
            
            <!-- Adding a delay to show the final bracket quickly -->
            <svg y="140" width="0" height="30" style="animation: type4 0.1s steps(1) forwards 8s; opacity: 0;">
                <text x="0" y="20">};</text>
            </svg>
        </g>
    </g>
</svg>
