<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="320">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');
            
            .bg { fill: #050505; }
            .matrix-text {
                font-family: 'Fira Code', Consolas, monospace;
                font-weight: 700;
                font-size: 16px;
                fill: #0f0;
                opacity: 0.15;
            }
            .matrix-glow {
                fill: #fff;
                opacity: 0.8;
                text-shadow: 0 0 8px #0f0, 0 0 15px #0f0;
            }
            
            .terminal {
                fill: rgba(10, 10, 10, 0.8);
                stroke: #0f0;
                stroke-width: 1.5;
                rx: 4;
            }
            .header-bar {
                fill: #0a0a0a;
                stroke: #0f0;
                stroke-width: 1.5;
                rx: 4;
            }
            
            .text {
                font-family: 'Fira Code', Consolas, monospace;
                font-weight: 500;
                font-size: 20px;
                fill: #0f0;
                text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
            }
            .prompt { fill: #0f0; font-weight: 700; }
            .string { fill: #fff; }
            .bracket { fill: #0f0; }

            /* Matrix Rain Animation - Simplified lines for performance */
            .rain-1 { animation: fall 4s linear infinite; }
            .rain-2 { animation: fall 6s linear infinite 1s; }
            .rain-3 { animation: fall 5s linear infinite 2s; }
            .rain-4 { animation: fall 7s linear infinite 0.5s; }
            .rain-5 { animation: fall 4.5s linear infinite 1.5s; }
            .rain-6 { animation: fall 5.5s linear infinite 2.5s; }
            
            @keyframes fall {
                0% { transform: translateY(-100%); opacity: 0; }
                10% { opacity: 1; }
                90% { opacity: 1; }
                100% { transform: translateY(1000px); opacity: 0; }
            }

            /* Typing Animations */
            .line-1 { animation: type1 1.5s steps(30, end) forwards; overflow: hidden; white-space: nowrap; width: 0; }
            .line-2 { animation: type2 1s steps(20, end) forwards 1.5s; overflow: hidden; white-space: nowrap; width: 0; opacity: 0; }
            .line-3 { animation: type3 1s steps(20, end) forwards 2.5s; overflow: hidden; white-space: nowrap; width: 0; opacity: 0; }
            .line-4 { animation: type4 2s steps(40, end) forwards 3.5s; overflow: hidden; white-space: nowrap; width: 0; opacity: 0; }
            .line-5 { animation: type5 2s steps(40, end) forwards 5.5s; overflow: hidden; white-space: nowrap; width: 0; opacity: 0; }
            
            .cursor {
                display: inline-block;
                width: 12px;
                height: 24px;
                background-color: #0f0;
                animation: blink 1s step-end infinite;
                box-shadow: 0 0 10px #0f0;
            }

            @keyframes type1 { 0% { width: 0; } 100% { width: 100%; } }
            @keyframes type2 { 0% { opacity: 1; width: 0; } 100% { opacity: 1; width: 100%; } }
            @keyframes type3 { 0% { opacity: 1; width: 0; } 100% { opacity: 1; width: 100%; } }
            @keyframes type4 { 0% { opacity: 1; width: 0; } 100% { opacity: 1; width: 100%; } }
            @keyframes type5 { 0% { opacity: 1; width: 0; } 100% { opacity: 1; width: 100%; } }
            @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
            
            /* Radar Sweep (distraction element) */
            .radar { stroke: #0f0; stroke-width: 1; fill: none; opacity: 0.3; }
            .sweep { 
                fill: url(#radarGrad);
                transform-origin: 650px 160px;
                animation: scan 4s linear infinite;
            }
            @keyframes scan { 100% { transform: rotate(360deg); } }
        </style>
        
        <radialGradient id="radarGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0f0" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#0f0" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Deep Black Background -->
    <rect width="800" height="320" class="bg" />

    <!-- Distraction 1: Background Digital Rain (Simplified Columns) -->
    <g class="matrix-text">
        <text x="50" y="0" class="rain-1">
            <tspan x="50" dy="20">0</tspan><tspan x="50" dy="20" class="matrix-glow">1</tspan><tspan x="50" dy="20">1</tspan><tspan x="50" dy="20">0</tspan><tspan x="50" dy="20">A</tspan><tspan x="50" dy="20">F</tspan><tspan x="50" dy="20">1</tspan>
        </text>
        <text x="120" y="-100" class="rain-2">
            <tspan x="120" dy="20">1</tspan><tspan x="120" dy="20">0</tspan><tspan x="120" dy="20">B</tspan><tspan x="120" dy="20" class="matrix-glow">9</tspan><tspan x="120" dy="20">0</tspan>
        </text>
        <text x="250" y="-50" class="rain-3">
            <tspan x="250" dy="20">0</tspan><tspan x="250" dy="20">1</tspan><tspan x="250" dy="20">1</tspan><tspan x="250" dy="20">E</tspan><tspan x="250" dy="20">7</tspan><tspan x="250" dy="20" class="matrix-glow">1</tspan>
        </text>
        <text x="400" y="-150" class="rain-4">
            <tspan x="400" dy="20">A</tspan><tspan x="400" dy="20">4</tspan><tspan x="400" dy="20">0</tspan><tspan x="400" dy="20">1</tspan><tspan x="400" dy="20" class="matrix-glow">1</tspan><tspan x="400" dy="20">0</tspan><tspan x="400" dy="20">X</tspan>
        </text>
        <text x="550" y="-20" class="rain-5">
            <tspan x="550" dy="20">1</tspan><tspan x="550" dy="20">1</tspan><tspan x="550" dy="20">0</tspan><tspan x="550" dy="20" class="matrix-glow">0</tspan>
        </text>
        <text x="700" y="-80" class="rain-6">
            <tspan x="700" dy="20">0</tspan><tspan x="700" dy="20">X</tspan><tspan x="700" dy="20">F</tspan><tspan x="700" dy="20">F</tspan><tspan x="700" dy="20">1</tspan><tspan x="700" dy="20" class="matrix-glow">0</tspan>
        </text>
    </g>

    <!-- Terminal Window -->
    <rect x="20" y="20" width="760" height="280" class="terminal" />
    
    <!-- Matrix Header -->
    <path class="header-bar" d="M 20 24 C 20 21.791 21.791 20 24 20 L 776 20 C 778.209 20 780 21.791 780 24 L 780 50 L 20 50 Z" />
    
    <text x="40" y="38" font-family="'Fira Code', monospace" font-size="14" fill="#0f0" font-weight="700">root@nebula:~# _</text>
    
    <!-- Code Content grouped for clipping base typing animation -->
    <g transform="translate(40, 85)">
        <g class="text">
            <!-- Line 1 -->
            <svg y="0" width="0" height="30" class="line-1">
                <text x="0" y="20">
                    <tspan class="prompt">$</tspan> execute_profile <tspan class="string">--load</tspan>
                </text>
            </svg>

            <!-- Line 2 -->
            <svg y="35" width="0" height="30" class="line-2">
                <text x="0" y="20">
                    <tspan class="bracket">[</tspan>OK<tspan class="bracket">]</tspan> Identity verified: <tspan class="string">Ali Essabbar</tspan>
                </text>
            </svg>

            <!-- Line 3 -->
            <svg y="70" width="0" height="30" class="line-3">
                <text x="0" y="20">
                    <tspan class="bracket">[</tspan>OK<tspan class="bracket">]</tspan> Designation: <tspan class="string">Full Stack Web Developer</tspan>
                </text>
            </svg>

            <!-- Line 4 -->
            <svg y="105" width="700" height="30" class="line-4">
                <text x="0" y="20">
                    <tspan class="prompt">></tspan> Loading Core Modules: <tspan class="string">[React, Python, Laravel]</tspan>
                </text>
            </svg>
            
            <!-- Line 5 -->
            <svg y="140" width="700" height="30" class="line-5">
                <text x="0" y="20">
                    <tspan class="prompt">></tspan> Mount Databases & SecTools: <tspan class="string">[MySQL, MongoDB, Kali]</tspan> 
                </text>
                
                <!-- The cursor -->
                <rect x="670" y="3" width="12" height="22" class="cursor" />
            </svg>
        </g>
    </g>

    <!-- Distraction 2: Cool Animated Radar/Targeting UI on the right -->
    <!-- Positioned cleverly so it doesn't overlap text, creating a "cyber" look -->
    <g transform="translate(650, 180)">
        <circle cx="0" cy="0" r="40" class="radar" />
        <circle cx="0" cy="0" r="60" class="radar" stroke-dasharray="4 8" />
        <circle cx="0" cy="0" r="80" class="radar" opacity="0.1" />
        
        <!-- Crosshairs -->
        <line x1="-90" y1="0" x2="90" y2="0" class="radar" />
        <line x1="0" y1="-90" x2="0" y2="90" class="radar" />
        
        <!-- Radar Sweep -->
        <path d="M 0 0 L 0 -80 A 80 80 0 0 1 80 0 Z" class="sweep" />
    </g>
    
    <g transform="translate(685, 45)">
        <text font-family="'Fira Code', monospace" font-size="10" fill="#0f0" opacity="0.5">SYS.MEM: OK</text>
        <text y="15" font-family="'Fira Code', monospace" font-size="10" fill="#0f0" opacity="0.5">NET.UPLINK: ACTIVE</text>
    </g>

</svg>
