<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290">
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#00ff41" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#00ff41" stop-opacity="0.95"/>
      <stop offset="0.85" stop-color="#00ff41" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff41" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>

    <mask id="scanMask">
      <rect width="1200" height="290" fill="black"/>
      <rect y="0" width="220" height="290" fill="white" opacity="0.95">
        <animate attributeName="x" from="-220" to="1200" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </mask>

    <style>
      .bg{fill:#000000;}
      .frame{fill:rgba(8,8,8,0.85);stroke:#00ff41;stroke-width:1.2;}
      .txt{font-family:Consolas,'Fira Code',monospace;fill:#9bff9b;font-size:18px;}
      .title{fill:#00ff41;font-weight:700;font-size:20px;}
      .label{fill:#00ff41;font-weight:700;}
      .hint{fill:#9bff9b;opacity:0.7;font-size:14px;}
      .barbg{fill:#061006;stroke:#00ff41;stroke-opacity:0.45;}
      .barfg{fill:url(#bar);filter:url(#glow);}
      .scanline{fill:url(#scan);opacity:0.9;}
    </style>
  </defs>

  <rect class="bg" width="1200" height="290"/>

  <rect x="20" y="20" width="1160" height="250" rx="10" class="frame"/>

  <text x="45" y="60" class="txt title">SKILL_MATRIX_SCAN</text>
  <text x="45" y="85" class="txt hint">&gt; running diagnostics... &gt; mapping toolchain... &gt; stable signal detected</text>

  <g mask="url(#scanMask)">
    <rect x="20" y="20" width="1160" height="250" class="scanline"/>
  </g>

  <g transform="translate(45,115)">
    <text class="txt label" x="0" y="0">FRONTEND</text>
    <rect class="barbg" x="150" y="-16" width="980" height="18" rx="9"/>
    <rect class="barfg" x="150" y="-16" width="880" height="18" rx="9"/>

    <text class="txt label" x="0" y="42">BACKEND</text>
    <rect class="barbg" x="150" y="26" width="980" height="18" rx="9"/>
    <rect class="barfg" x="150" y="26" width="820" height="18" rx="9"/>

    <text class="txt label" x="0" y="84">DATABASES</text>
    <rect class="barbg" x="150" y="68" width="980" height="18" rx="9"/>
    <rect class="barfg" x="150" y="68" width="760" height="18" rx="9"/>

    <text class="txt label" x="0" y="126">SECURITY</text>
    <rect class="barbg" x="150" y="110" width="980" height="18" rx="9"/>
    <rect class="barfg" x="150" y="110" width="740" height="18" rx="9"/>

    <text class="txt label" x="0" y="168">DEVOPS</text>
    <rect class="barbg" x="150" y="152" width="980" height="18" rx="9"/>
    <rect class="barfg" x="150" y="152" width="700" height="18" rx="9"/>
  </g>
</svg>
