<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#00ff41" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0.1"/>
    </linearGradient>

    <style>
      .bg{fill:#000000;}
      .frame{fill:rgba(8,8,8,0.85);stroke:#00ff41;stroke-width:1.2;}
      .txt{font-family:Consolas,'Fira Code',monospace;fill:#9bff9b;font-size:16px;}
      .title{fill:#00ff41;font-weight:700;font-size:20px;}
      .muted{opacity:0.7;}
      .grid{stroke:#00ff41;stroke-opacity:0.12;stroke-width:1;}
      .barbg{fill:#061006;stroke:#00ff41;stroke-opacity:0.35;}
      .barfg{fill:#00ff41;filter:url(#glow);}
      .line{stroke:#00ff41;stroke-width:2.2;fill:none;filter:url(#glow);}
      .dot{fill:#9bff9b;filter:url(#glow);}
      .pulse{fill:url(#pulse);opacity:0.55;}
    </style>
  </defs>

  <rect class="bg" width="1200" height="420"/>

  <rect x="20" y="20" width="1160" height="380" rx="12" class="frame"/>

  <text x="45" y="60" class="txt title">SYSTEM_TELEMETRY (LOCAL)</text>
  <text x="45" y="85" class="txt muted">&gt; external cards disabled  |  &gt; fallback renderer active  |  &gt; signal: stable</text>

  <g>
    <line x1="45" y1="115" x2="1155" y2="115" class="grid"/>
    <line x1="45" y1="160" x2="1155" y2="160" class="grid"/>
    <line x1="45" y1="205" x2="1155" y2="205" class="grid"/>
    <line x1="45" y1="250" x2="1155" y2="250" class="grid"/>
    <line x1="45" y1="295" x2="1155" y2="295" class="grid"/>
    <line x1="45" y1="340" x2="1155" y2="340" class="grid"/>
  </g>

  <g transform="translate(45,135)">
    <text class="txt" x="0" y="0"><tspan class="title">CORE_LOAD_LEVELS</tspan></text>

    <text class="txt" x="0" y="38">CPU</text>
    <rect class="barbg" x="90" y="24" width="520" height="16" rx="8"/>
    <rect class="barfg" x="90" y="24" width="420" height="16" rx="8">
      <animate attributeName="width" values="380;440;410;460;420" dur="2.8s" repeatCount="indefinite"/>
    </rect>

    <text class="txt" x="0" y="74">MEM</text>
    <rect class="barbg" x="90" y="60" width="520" height="16" rx="8"/>
    <rect class="barfg" x="90" y="60" width="360" height="16" rx="8">
      <animate attributeName="width" values="330;370;350;390;360" dur="3.1s" repeatCount="indefinite"/>
    </rect>

    <text class="txt" x="0" y="110">NET</text>
    <rect class="barbg" x="90" y="96" width="520" height="16" rx="8"/>
    <rect class="barfg" x="90" y="96" width="300" height="16" rx="8">
      <animate attributeName="width" values="260;320;280;340;300" dur="2.4s" repeatCount="indefinite"/>
    </rect>

    <text class="txt" x="0" y="146">IO</text>
    <rect class="barbg" x="90" y="132" width="520" height="16" rx="8"/>
    <rect class="barfg" x="90" y="132" width="340" height="16" rx="8">
      <animate attributeName="width" values="310;350;330;370;340" dur="2.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(700,135)">
    <text class="txt" x="0" y="0"><tspan class="title">ACTIVITY_PULSE</tspan></text>

    <rect class="pulse" x="0" y="24" width="440" height="150" rx="10">
      <animate attributeName="opacity" values="0.25;0.6;0.35;0.7;0.25" dur="2.2s" repeatCount="indefinite"/>
    </rect>

    <path class="line" d="M 10 150 L 55 120 L 95 135 L 130 95 L 165 110 L 200 70 L 235 92 L 270 55 L 305 85 L 340 65 L 375 100 L 410 80"/>

    <circle class="dot" cx="55" cy="120" r="3"/>
    <circle class="dot" cx="130" cy="95" r="3"/>
    <circle class="dot" cx="200" cy="70" r="3"/>
    <circle class="dot" cx="270" cy="55" r="3"/>
    <circle class="dot" cx="340" cy="65" r="3"/>
    <circle class="dot" cx="410" cy="80" r="3"/>

    <circle class="dot" r="6" cx="410" cy="80" opacity="0.65">
      <animate attributeName="r" values="6;10;6" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;0.15;0.65" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
