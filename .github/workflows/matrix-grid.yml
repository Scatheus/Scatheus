name: Generate Matrix Mainframe

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Matrix 3D Grid Generation
        uses: lowlighter/metrics@latest
        with:
          # We use the new GH_PAT secret here
          token: ${{ secrets.GH_PAT }}
          user: Scatheus
          filename: github-metrics-isocalendar.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Africa/Casablanca
          # Force the bot to commit the file to your main branch
          output_action: commit
          committer_branch: main
          committer_message: "System Update: Matrix Mainframe Synchronized"
